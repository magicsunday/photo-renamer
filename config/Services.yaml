parameters:
    env(MAX_COMPARISON_PAIRS): '100000'

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: false

    _instanceof:
        Symfony\Component\Console\Command\Command:
            tags: ['command']

    Symfony\Component\Filesystem\Filesystem: ~

    # Makes classes in src/ available to be used as services.
    # This creates a service per class whose id is the fully qualified class name.
    MagicSunday\Renamer\:
        resource: '../src/'
        exclude: ['../src/{Renamer,Dependencies,Constants}.php', '../src/Model/']

    MagicSunday\Renamer\Service\Filesystem\BatchRunLock:
        arguments:
            $stateDirectory: '%env(default::string:CACHE_DIR)%'

    MagicSunday\Renamer\Service\Filesystem\MutationJournal:
        arguments:
            $stateDirectory: '%env(default::string:CACHE_DIR)%'

    # Source checks must not flush or reuse classification's hash cache.
    renamer.source_hash_calculator:
        class: MagicSunday\Renamer\Service\SafeHashCalculator

    MagicSunday\Renamer\Service\Filesystem\SourceIdentityGuard:
        arguments:
            $hashCalculator: '@renamer.source_hash_calculator'

    MagicSunday\Renamer\Service\ComparisonWorkLimit:
        factory: ['MagicSunday\Renamer\Service\ComparisonWorkLimit', 'fromEnvironment']
        arguments:
            $maximumPairs: '%env(string:MAX_COMPARISON_PAIRS)%'

    MagicSunday\Renamer\Application:
        public: true
        arguments:
            $commands: !tagged_iterator command

    # Service interfaces and implementations
    MagicSunday\Renamer\Service\Reporting\ProgressReporterInterface:
        class: MagicSunday\Renamer\Service\Reporting\ConsoleProgressReporter
        arguments:
            $io: '@Symfony\Component\Console\Style\SymfonyStyle'

    MagicSunday\Renamer\Service\ContentClassifierInterface:
        alias: MagicSunday\Renamer\Service\ContentClassifier

    MagicSunday\Renamer\Service\HashSubGroupingServiceInterface:
        class: MagicSunday\Renamer\Service\HashSubGroupingService

    MagicSunday\Renamer\Service\SafeHashCalculatorInterface:
        class: MagicSunday\Renamer\Service\SafeHashCalculator

    MagicSunday\Renamer\Service\LivePhoto\LivePhotoConflictDetectorInterface:
        class: MagicSunday\Renamer\Service\LivePhoto\LivePhotoConflictDetector

    MagicSunday\Renamer\Service\LivePhoto\LivePhotoPairingServiceInterface:
        class: MagicSunday\Renamer\Service\LivePhoto\LivePhotoPairingService

    MagicSunday\Renamer\Service\DuplicateDetectionServiceInterface:
        class: MagicSunday\Renamer\Service\DuplicateDetectionService

    MagicSunday\Renamer\Service\PerceptualHash\PerceptualHashCalculatorInterface:
        class: MagicSunday\Renamer\Service\PerceptualHash\PerceptualHashCalculator

    # Pipeline collaborators
    MagicSunday\Renamer\Service\CanonicalScorerInterface:
        class: MagicSunday\Renamer\Service\CanonicalScorer

    MagicSunday\Renamer\Service\Pipeline\CaptureGroupBuilderInterface:
        class: MagicSunday\Renamer\Service\Pipeline\CaptureGroupBuilder

    MagicSunday\Renamer\Service\Pipeline\CrossGroupVideoDuplicateReconcilerInterface:
        class: MagicSunday\Renamer\Service\Pipeline\CrossGroupVideoDuplicateReconciler

    MagicSunday\Renamer\Service\Video\VideoStreamFingerprintMatcherInterface:
        class: MagicSunday\Renamer\Service\Video\VideoStreamFingerprintMatcher

    MagicSunday\Renamer\Service\Pipeline\CompanionDetectorInterface:
        class: MagicSunday\Renamer\Service\Pipeline\CompanionDetector

    MagicSunday\Renamer\Service\Execution\ExecutionPlanBuilderInterface:
        class: MagicSunday\Renamer\Service\Execution\ExecutionPlanBuilder

    MagicSunday\ImageMeta\MetadataReader:
        factory: ['MagicSunday\ImageMeta\MetadataReader', 'createDefault']
