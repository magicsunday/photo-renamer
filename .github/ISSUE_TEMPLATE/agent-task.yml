name: "Agent Task"
description: "Task for agent implementation with TDD and minimal-change rules."
title: "<Title starting with capital letter>"
labels:
    - agent
    - needs-implementation
body:
    - type: markdown
      attributes:
          value: |
              ## Agent Instructions (Read First)
              This repo is governed by `AGENTS.md`.
              If you would need to guess, expand scope, or relax guards: **STOP** and ask.

              **TDD workflow:** Write a failing test first, then implement the minimal code to make it pass.
              **Commit workflow:** Use `GH-<N>` for issue-tracked work (or `main` where authorized), as specified in `AGENTS.md`.
              **Commit message:** Capitalised English imperative; issue subjects and PR titles use `GH-<N>: <Capitalised imperative>`. Conventional-commit prefixes are rejected. Preserve DCO `Signed-off-by`; never add AI attribution.
              **CI gate:** Run `make test` before committing. All checks must pass.
              **Merge/close rule:** Read every page of issue comments, PR reviews and inline comments. Individually evidence and check all acceptance criteria, complete own review, and require successful checks for the exact reviewed head before squash merge with a dedicated descriptive title/body and DCO. Do not close an issue with unresolved acceptance work.

    - type: textarea
      id: goal
      attributes:
          label: "Goal"
          description: "What should be achieved? State observable behavior, not implementation."
          placeholder: |
              Example:
              - rename:exif should detect and skip already-renamed Live Photo pairs
              - rename:verify should report files with ambiguous timezone metadata
      validations:
          required: true

    - type: textarea
      id: scope
      attributes:
          label: "Allowed file scope"
          description: "List the ONLY files/paths the agent may modify. If more are needed, the agent must STOP."
          placeholder: |
              Example:
              - src/Service/DuplicateDetectionService.php
              - tests/Unit/Service/DuplicateDetectionServiceTest.php
      validations:
          required: true

    - type: textarea
      id: acceptance
      attributes:
          label: "Acceptance criteria"
          description: "Concrete pass/fail criteria."
          placeholder: |
              Example:
              - make test green (PHPStan max, PHPUnit, CGL, Rector)
              - At least 1 positive + 1 negative test
              - Idempotent: re-running on already-processed files produces identical results
      validations:
          required: true

    - type: textarea
      id: tests_required
      attributes:
          label: "Tests (what to add/adjust)"
          description: "Describe minimal test cases. If tests-only, say so."
          placeholder: |
              Example:
              - Add test: itSkipsAlreadyCorrectlyNamedLivePhotoPair
              - Use StubMetadataExtractor (no real EXIF files)
      validations:
          required: false

    - type: textarea
      id: risks
      attributes:
          label: "Risks / notes"
          description: "Anything tricky or worth knowing."
          placeholder: |
              Example:
              - Timezone-sensitive: PHP container runs in UTC
              - Live Photo pairing: MOV always inherits still's date
      validations:
          required: false
