name: "Feature Request"
description: "Suggest an idea for Photo Renamer."
title: ""
labels:
    - enhancement
body:
    - type: textarea
      id: problem
      attributes:
          label: "Is your feature request related to a problem?"
          description: "A clear description of the problem."
          placeholder: "When processing MOV files, I wish..."
      validations:
          required: false

    - type: textarea
      id: solution
      attributes:
          label: "Describe the solution you'd like"
          description: "What you want to happen."
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: "Describe alternatives you've considered"
          description: "Any workarounds or alternative approaches you've tried."
      validations:
          required: false

    - type: textarea
      id: additional_context
      attributes:
          label: "Additional context"
          description: "Example filenames, use cases, or screenshots."
      validations:
          required: false
