name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.5']

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq ffmpeg exiftool libheif-dev libmagickwand-dev

            - name: Set up PHP version ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: imagick, gd
                  tools: composer:v2

            - name: Install Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '22'

            - id: install
              name: Install dependencies
              run: |
                  composer validate
                  composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
                  npm install --prefix .build jscpd@^5.0.11

            - name: Lint
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:lint

            - name: CGL
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:cgl

            - name: Rector
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:rector

            - name: PHPStan
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:phpstan

            - name: PHPUnit
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:unit

            - name: Copy-Paste Detection
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:cpd
