name: CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ '8.5' ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Install system dependencies
                run: |
                    sudo apt-get update -qq
                    sudo apt-get install -y -qq ffmpeg exiftool libheif-dev libmagickwand-dev

            -   name: Set up PHP version ${{ matrix.php }}
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: imagick, gd
                    tools: composer:v2

            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '22'

            -   id: install
                name: Install dependencies
                run: |
                    composer validate
                    composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
                    npm install --prefix .build jscpd

            -   name: Lint
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: composer ci:test:php:lint

            -   name: CGL
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: composer ci:test:php:cgl

            -   name: Rector
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: composer ci:test:php:rector

            -   name: PHPStan
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: composer ci:test:php:phpstan

            -   name: PHPUnit
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: composer ci:test:php:unit

            -   name: Copy-Paste Detection
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: composer ci:test:php:cpd
