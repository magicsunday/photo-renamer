name: CI

on:
    push:
        branches: [main, master, '*.x', WIP]
    pull_request:

permissions:
    contents: read

jobs:
    # Copy-paste detection runs in the shared Node-only lane, since jscpd is a
    # Node tool.
    cpd:
        uses: magicsunday/.github/.github/workflows/cpd.yml@main
        permissions:
            contents: read

    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.5']

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq ffmpeg exiftool libheif-dev libmagickwand-dev

            - name: Set up PHP version ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: imagick, gd
                  tools: composer:v2

            - id: install
              name: Install dependencies
              run: |
                  composer validate
                  composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

            - name: No-dev runtime smoke
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: bash scripts/check-no-dev-runtime

            - name: Lint
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:lint

            - name: CGL
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:cgl

            - name: Rector
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:rector

            - name: PHPStan
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:phpstan

            - name: Deptrac
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:deptrac

            - name: Templates
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:templates

            - name: PHPUnit
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:unit
