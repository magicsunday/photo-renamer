name: Security

on:
    push:
        branches: [main, master]
    pull_request:
    schedule:
        - cron: '27 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    code-scanning:
        uses: magicsunday/.github/.github/workflows/code-scanning.yml@main
        permissions:
            contents: read
            security-events: write

    zizmor:
        uses: magicsunday/.github/.github/workflows/zizmor.yml@main
        permissions:
            contents: read
            security-events: write

    scorecard:
        # Publish only for the default branch, including manual workflow runs.
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: magicsunday/.github/.github/workflows/scorecard.yml@main
        permissions:
            contents: read
            security-events: write
            id-token: write

    dependency-review:
        # The dependency-review action only runs in a pull-request context.
        if: github.event_name == 'pull_request'
        uses: magicsunday/.github/.github/workflows/dependency-review.yml@main
        permissions:
            contents: read
            pull-requests: write

    yamllint:
        uses: magicsunday/.github/.github/workflows/yamllint.yml@main
        permissions:
            contents: read

    composer-audit:
        name: Locked Composer audit
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Composer
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  tools: composer:v2
                  coverage: none

            - name: Audit every locked production and development package
              run: |
                  bash scripts/check-lock.sh
                  composer ci:test:php:audit

    mutation:
        name: Full mutation gate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build the pinned development image
              run: docker compose build buildbox

            - name: Install the locked development toolchain
              run: |
                  export USERID="$(id -u)" GROUPID="$(id -g)"
                  bash scripts/check-lock.sh
                  docker compose -f compose.yaml -f .github/ci-mutation.compose.yaml run --rm buildbox composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

            - name: Run the full mutation score gate with PCOV
              run: |
                  export USERID="$(id -u)" GROUPID="$(id -g)"
                  make mutation COMPOSE_BIN="docker compose -f compose.yaml -f .github/ci-mutation.compose.yaml"
