name: Security

on:
    push:
        branches: [main, master]
    pull_request:
    schedule:
        - cron: '27 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    code-scanning:
        uses: magicsunday/.github/.github/workflows/code-scanning.yml@main
        permissions:
            contents: read
            security-events: write

    zizmor:
        uses: magicsunday/.github/.github/workflows/zizmor.yml@main
        permissions:
            contents: read
            security-events: write

    scorecard:
        # Publish only for the default branch, including manual workflow runs.
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: magicsunday/.github/.github/workflows/scorecard.yml@main
        permissions:
            contents: read
            security-events: write
            id-token: write

    dependency-review:
        # The dependency-review action only runs in a pull-request context.
        if: github.event_name == 'pull_request'
        uses: magicsunday/.github/.github/workflows/dependency-review.yml@main
        permissions:
            contents: read
            pull-requests: write

    yamllint:
        uses: magicsunday/.github/.github/workflows/yamllint.yml@main
        permissions:
            contents: read

    composer-audit:
        # The audit reads the advisory database of the day. On a pull request a
        # newly published advisory against an existing dependency would turn
        # every open pull request red without any change in it, and
        # dependency-review already covers what a pull request changes.
        if: github.event_name != 'pull_request'
        uses: magicsunday/.github/.github/workflows/composer-audit.yml@main
        permissions:
            contents: read

    mutation:
        # Extra of this repository, not part of the canonical file. The full mutation
        # gate runs only on schedule and manual runs, in the pinned development image.
        name: Full mutation gate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build the pinned development image
              run: docker compose build buildbox

            - name: Install the locked development toolchain
              run: |
                  export USERID="$(id -u)" GROUPID="$(id -g)"
                  bash scripts/check-lock.sh
                  docker compose -f compose.yaml -f .github/ci-mutation.compose.yaml run --rm buildbox composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

            - name: Run the full mutation score gate with PCOV
              run: |
                  export USERID="$(id -u)" GROUPID="$(id -g)"
                  make mutation COMPOSE_BIN="docker compose -f compose.yaml -f .github/ci-mutation.compose.yaml"

    all-security-checks:
        # One stable check name for the branch protection. It runs whatever the
        # other jobs did, passes when each of them succeeded or was skipped, and
        # fails on a failure, a cancellation or any other result. The needs
        # list must name every other job of this file.
        name: All security checks
        if: ${{ always() }}
        needs: [code-scanning, zizmor, scorecard, dependency-review, yamllint, composer-audit, mutation]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}

        steps:
            - name: Check the results of the security jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  set -euo pipefail
                  verdict=$(jq -rn --argjson needs "${NEEDS}" '
                      $needs
                      | if (type != "object") or (length == 0) then "no job results"
                      else
                          [to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"]
                          | join(" ")
                      end')
                  if [ -n "${verdict}" ]; then
                      echo "::error::Security jobs did not pass: ${verdict}"
                      exit 1
                  fi
                  echo 'Every security job succeeded or was skipped.'
